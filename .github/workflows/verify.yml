name: Verify GonkaStats
# Runs on pushes and pull requests. Snapshot creation performs bounded,
# read-only public-source requests; serving the retained snapshot is offline.
# Also available on demand via workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gonkastats-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Verify page metadata and crawler routes
        run: npm run test:seo
      - name: Capture bounded live public observations
        run: npm run snapshot
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser verification
        run: npm run test:e2e
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gonkastats-verification
          path: artifacts/
          retention-days: 3
          if-no-files-found: warn
