name: Apply and verify scoped site cleanup once
on:
  push:
    branches: [fix/unify-site-maintenance-20261003]
    paths: ['.github/maintenance/unify-cleanup.py', '.github/workflows/apply-unify-once.yml']
permissions:
  contents: write
concurrency:
  group: gonkastats-unify-once
  cancel-in-progress: true
jobs:
  cleanup:
    if: github.repository == 'NosytLabs/Gonkastats'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact-base patch and remove temporary tooling
        run: |
          test "$(git merge-base HEAD 28d121eee8c425fa572c8a6527104f489db7e08b)" = '28d121eee8c425fa572c8a6527104f489db7e08b'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','28d121eee8c425fa572c8a6527104f489db7e08b','HEAD'],text=True).splitlines()
          assert set(changed)=={'.github/maintenance/unify-cleanup.py','.github/workflows/apply-unify-once.yml'},'Application changed; refusing base-dependent patch'
          p=Path('.github/maintenance/unify-cleanup.py')
          text=p.read_text().replace('EyhYFo2jiy8C/uHDrz7','EyhYFo2jRQBkDLeoeiBUdyqrCuBsvbLoEh7kaC1FehWNBeJ1vTPuFmiRIQ3Vx+J61TNNc6zz7H3knbgB9KlXgu7Yh9MSNzVXIW8gb+NxjsIhgGk0uw99T2BEII47B9Sqdwc7GeUjMt2BBS9nWZubdF0vqFfG3fFZOzh/Vv0j5uRZkFB1S/QGesHJ0utlOutik134cxJdLFMRHhPdqrmvj9/9Ze/j4GT/4/vBkeu50yxbyHazCTTFv0jiy8C/uHDrz7')
          exec(compile(text,str(p),'exec'))
          def update(path,old,new):
              p=Path(path);text=p.read_text();assert old in text,(path,old);p.write_text(text.replace(old,new,1))
          update('scripts/maintenance-qa.mjs',"getByLabel('Model',{exact:true})","getByRole('combobox',{name:'Model',exact:true})")
          update('scripts/maintenance-qa.mjs',"const page=await browser.newPage({viewport:{width:1440,height:1000},reducedMotion:'reduce'});","const context=await browser.newContext({viewport:{width:1440,height:1000},reducedMotion:'reduce'});const page=await context.newPage();")
          p=Path('src/core/cost.ts');p.write_text(p.read_text()+'\n/** Preserve fractional GNK precision; never round a charge to free. */\nexport function formatGnkCost(value:string|null|undefined):string{return value==null?"—":new Decimal(value).toFixed();}\n')
          update('src/features/cost-lab.tsx','simulateCost,observedCostRates,type','simulateCost,observedCostRates,formatGnkCost,type')
          update('src/features/cost-lab.tsx',"format(result?.singleAttemptGnk,'number')",'formatGnkCost(result?.singleAttemptGnk)')
          update('src/features/cost-lab.tsx',"format(result?.retryScenarioGnk,'number')",'formatGnkCost(result?.retryScenarioGnk)')
          p=Path('tests/maintenance-signals.test.ts');p.write_text(p.read_text()+'''
          it('small nonzero GNK costs remain visible instead of rounding to zero',()=>{
           const s=emptySnapshot();s.sources=['params'].map(id=>({...unavailable(id),status:'recent',error:null}));s.protocol['devshard_escrow_params.token_price']='10';
           const rendered=renderToStaticMarkup(createElement(CostLabPage,{s}));expect(rendered).toContain('data-testid="cost-single">0.0000125 ');expect(rendered).toContain('data-testid="cost-retry">0.00001875 ');
          });
          ''')
          PY
          rm .github/maintenance/unify-cleanup.py .github/workflows/apply-unify-once.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:seo
      - run: npm run snapshot
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit verified changes only to the unchanged feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/unify-site-maintenance-20261003 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'Nosyt Labs'
          git config user.email 'hi@nosytlabs.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: unify source-aware site tools and maintained documentation'
          git push origin HEAD:refs/heads/fix/unify-site-maintenance-20261003
          git rev-parse HEAD HEAD^{tree}
      - name: Preserve bounded verification evidence
        if: always()
        run: |
          mkdir -p artifacts
          git diff --stat > artifacts/worktree-summary.txt
          git rev-parse HEAD HEAD^{tree} > artifacts/verified-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gonkastats-unify-verification
          path: artifacts/
          retention-days: 3
          if-no-files-found: warn
