name: GonkaStats v2 TDD
on:
  push:
    branches: [feat/gonkastats-v2]
permissions:
  contents: read
concurrency:
  group: gonkastats-v2-tdd
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- tests/protocol.test.ts tests/source-dependencies.test.ts tests/providers.test.ts tests/v2-snapshot-contract.test.ts tests/v2-collector.test.ts
