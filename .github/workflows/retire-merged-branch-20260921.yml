name: Retire verified duplicate branch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-merged-branch-20260921.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  retire:
    if: >-
      github.repository == 'NosytLabs/Gonkastats' && github.event.head_commit.message == 'ops: retire verified duplicate branch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pause verification and delete only the unchanged integrated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, tempfile
          from urllib.parse import quote
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'NosytLabs/Gonkastats' and os.environ['GITHUB_REF'] == 'refs/heads/main'
          branch = 'feat/community-observatory'
          expected = '44cfe969dc87c61e4d275207ba8d4b8a6dbcb739'
          def api(path, method='GET'):
              raw = subprocess.check_output(['gh', 'api', '--method', method, f'repos/{repo}/{path}'], text=True, timeout=30)
              return json.loads(raw) if raw.strip() else None
          own = api('actions/runs/' + os.environ['GITHUB_RUN_ID'])['workflow_id']
          api(f'actions/workflows/{own}/disable', 'PUT')
          verify = api('actions/workflows/verify.yml')
          assert verify['path'] == '.github/workflows/verify.yml'
          api(f"actions/workflows/{verify['id']}/disable", 'PUT')
          main_before = api('branches/main')['commit']['sha']
          proof = api(f'compare/{expected}...{main_before}')
          assert proof['status'] in ('identical', 'ahead') and proof['merge_base_commit']['sha'] == expected
          current = api('branches/' + quote(branch, safe=''))
          assert not current['protected'] and current['commit']['sha'] == expected
          assert not api('pulls?state=open&head=' + quote('NosytLabs:' + branch, safe=''))
          preserved = api('branches/' + quote('feat/gonkastats-observatory', safe=''))['commit']['sha']
          ref = 'refs/heads/' + branch
          env = {key: value for key, value in os.environ.items() if not key.startswith('GIT_')}
          header = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_COUNT='1',
                     GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + header)
          with tempfile.TemporaryDirectory() as directory:
              env['HOME'] = directory
              subprocess.run(['git', 'init', '-q', directory], check=True, capture_output=True, env=env)
              subprocess.run(['git', '-C', directory, 'push', '--porcelain', '--force-with-lease=' + ref + ':' + expected,
                              f'https://github.com/{repo}.git', ':' + ref], check=True, capture_output=True, env=env, timeout=60)
          remaining = [item['name'] for item in api('branches?per_page=100')]
          assert branch not in remaining and 'feat/gonkastats-observatory' in remaining
          assert api('branches/' + quote('feat/gonkastats-observatory', safe=''))['commit']['sha'] == preserved
          report = {'repository': repo, 'deleted_branch': branch, 'expected_sha': expected,
                    'remaining_branches': remaining, 'main_after': api('branches/main')['commit']['sha'],
                    'preserved_alternative_sha': preserved,
                    'verification_disabled': api(f"actions/workflows/{verify['id']}")['state'] == 'disabled_manually',
                    'self_disabled': api(f'actions/workflows/{own}')['state'] == 'disabled_manually'}
          assert report['verification_disabled'] and report['self_disabled']
          print('BRANCH_RETIREMENT_RESULT=' + json.dumps(report), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
