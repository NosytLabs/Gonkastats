name: Verify scoped SEO cleanup
on:
  push:
    branches: [fix/seo-security-cleanup-20261003]
    paths: ['.github/maintenance/apply-seo-cleanup.py', '.github/workflows/cleanup-20261003.yml']
permissions:
  contents: write
concurrency:
  group: gonkastats-seo-cleanup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup:
    if: github.repository == 'NosytLabs/Gonkastats'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/seo-security-cleanup-20261003
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source edits
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 .github/maintenance/apply-seo-cleanup.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ['robots.ts','sitemap.ts']:
              p=Path('src/app')/name
              p.write_text(p.read_text().replace("from '@/core/seo'", "from '../core/seo'"))
          p=Path('scripts/qa-fixture.mjs')
          p.write_text(p.read_text().replace(",'utf8')));", ",'utf8'));"))
          p=Path('src/app/observatory.css')
          old='.kpi-tile{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:11px;overflow:hidden}'
          if old not in p.read_text(): raise SystemExit('KPI rule changed; inspect before editing')
          p.write_text(p.read_text().replace(old,old.replace('overflow:hidden','overflow:visible')))
          PY
          for file in scripts/*.mjs; do node --check "$file"; done
      - name: Resolve patched framework and verify locked install
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund 2>&1 | tee artifacts/dependency-update.log
          npm ci --no-audit --no-fund 2>&1 | tee artifacts/install.log
      - name: Record dependency advisory results
        run: |
          npm audit --json > artifacts/dependency-audit.json || true
          npm audit --omit=dev --json > artifacts/production-dependency-audit.json || true
      - name: Unit and contract regression suite
        run: set -o pipefail; npm test 2>&1 | tee artifacts/unit-tests.log
      - name: Typecheck and lint
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee artifacts/typecheck.log
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Build production application
        run: set -o pipefail; npm run build 2>&1 | tee artifacts/build.log
      - name: Capture real public API observations once
        run: |
          set -euo pipefail
          npm run snapshot 2>&1 | tee artifacts/public-sources.log
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          snapshot=json.loads(Path('data/snapshot.json').read_text())
          if not any(s['status']!='unavailable' for s in snapshot['sources']):
              raise SystemExit('No public observation is usable; do not commit an empty fixture')
          snapshot['mode']='snapshot'
          target=Path('tests/fixtures/public-observation.json')
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(snapshot,separators=(',',':'))+'\n')
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          Path('tests/fixtures/README.md').write_text('# Retained public QA observation\n\nCaptured '+snapshot['generatedAt']+' by the real public collector.\n\nSHA-256: `'+digest+'`.\n\nThis fixture is test-only. It preserves source timestamps, errors, coverage and exact string quantities. It is never used as a production fallback. `npm run qa:fixture` explicitly writes it to the ignored local snapshot file for reproducible browser verification; live production defaults remain unchanged. No private account or credential data is included. Refresh only through an explicit public-source verification run.\n')
          Path('artifacts/source-status.json').write_text(json.dumps({'generatedAt':snapshot['generatedAt'],'sources':snapshot['sources']},indent=2))
          PY
          npm run qa:fixture
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all UI flows and SEO behavior
        run: set -o pipefail; npm run test:e2e 2>&1 | tee artifacts/browser-tests.log
      - name: Record evidence and commit verified source only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          reports={p.name:json.loads(p.read_text()) for p in Path('artifacts').glob('*report.json')}
          if len(reports)!=6 or any(v.get('result')!='passed' for v in reports.values()):
              raise SystemExit('Incomplete or failed browser verification')
          sources=json.loads(Path('artifacts/source-status.json').read_text())
          audit=json.loads(Path('artifacts/dependency-audit.json').read_text())
          prod=json.loads(Path('artifacts/production-dependency-audit.json').read_text())
          run='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          clean=lambda s:re.sub(r'\x1b\[[0-9;]*m','',s)
          unit=clean(Path('artifacts/unit-tests.log').read_text())
          counts='\n'.join(line.strip() for line in unit.splitlines() if 'Test Files' in line or ('Tests' in line and 'passed' in line))
          unavailable=[s['name']+': '+str(s['error']) for s in sources['sources'] if s['status']=='unavailable']
          summary={'run':run,'startingCommit':os.environ['GITHUB_SHA'],'unitCounts':counts,'browserReports':list(reports),'sourceTimestamp':sources['generatedAt'],'unavailable':unavailable,'audit':audit.get('metadata',{}),'productionAudit':prod.get('metadata',{})}
          Path('artifacts/summary.json').write_text(json.dumps(summary,indent=2))
          Path('docs/SEO-CLEANUP-VERIFICATION.md').write_text('# SEO, UI and security cleanup verification\n\nRun: '+run+'\n\nStarting branch commit: `'+os.environ['GITHUB_SHA']+'`. The run applied the reviewed maintenance script, regenerated the pinned lockfile, ran verification, and committed the verified source.\n\n## Verification\n\n```text\n'+counts+'\n```\n\nTypecheck, lint, production build and all six browser suites completed successfully. Downloadable Actions evidence contains exact page, API, accessibility and interaction results. This is not a manual WCAG certification, field Core Web Vitals measurement or penetration test.\n\n## Public observation\n\nCaptured '+sources['generatedAt']+'.\n\nUnavailable sources: '+('; '.join(unavailable) or 'none in this observation')+'. Failures remain unavailable; no metrics were invented.\n\n## Dependencies\n\nNext.js and eslint-config-next were updated together to 16.3.8 with a regenerated lockfile. Full audit summary: `'+json.dumps(audit.get('metadata',{}).get('vulnerabilities',{}))+'`. Production-only audit summary: `'+json.dumps(prod.get('metadata',{}).get('vulnerabilities',{}))+'`. A vulnerable dependency report is not proof a vulnerable path is exposed by this application.\n\n## Publication boundary\n\nSet SITE_URL to the real public HTTPS origin to emit indexable landing pages and a populated sitemap. Leave it blank locally; SITE_NOINDEX=true and snapshot/preview mode prevent indexing. The former localhost SITE_URL example is no longer valid. No domain or public deployment was provisioned. Public API access remains read-only.\n\n## Cleanup\n\nRoutine browser CI now uses an explicitly dated public QA fixture, not live RPC polling. Manual live_sources remains available. No cron jobs were added. The temporary privileged maintenance workflow and implementation script were removed before committing source.\n')
          readme=Path('README.md');text=readme.read_text()
          start=text.find('## Current verification');end=text.find('\n## Accuracy and limitations',start)
          if start>=0 and end>start:
              text=text[:start]+'## Current verification\n\nSee [the latest cleanup verification](docs/SEO-CLEANUP-VERIFICATION.md) and [the passing run]('+run+'). Earlier records are historical evidence, not a claim about current source availability.\n\n'+text[end:]
          text=re.sub(r'During the September 23 verification snapshot,.*?Inference demand remains unavailable;', 'Public-source availability is recorded with timestamps in the latest verification record. Unavailable inference demand is not substituted with chain activity;',text,flags=re.S)
          text=text.replace('Main retains **manual-only verification**','Main retains **bounded verification**')
          text+='\n## SEO publication and reproducible QA\n\nSet `SITE_URL` to the deployed public HTTPS origin, without a path. Leave it blank for local work; remove the previous `http://localhost:3000` example from existing local environment files. Snapshot and preview modes remain `noindex`, and no public hostname is guessed. Set `SITE_NOINDEX=true` for other staging installs.\n\nRoutine CI uses `npm run qa:fixture` for a clearly dated, real public observation; it does not call live RPC endpoints. `npm run snapshot` still performs live reads and is available through manual `live_sources` verification. The fixture is never a production fallback.\n'
          readme.write_text(text)
          for name in ['.github/maintenance/apply-seo-cleanup.py','.github/workflows/cleanup-20261003.yml']:
              Path(name).unlink()
          PY
          remote=$(git ls-remote origin refs/heads/fix/seo-security-cleanup-20261003 | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Remote moved; leaving evidence for reconciliation'; exit 1; }
          git config user.name 'Nosyt Labs'
          git config user.email 'hi@nosytlabs.com'
          git add src scripts tests package.json package-lock.json .env.example next.config.mjs .github README.md docs/SEO-CLEANUP-VERIFICATION.md
          git diff --cached --check
          git diff --cached --stat | tee artifacts/change-stat.txt
          git commit -m 'fix: ship verified SEO publication, security and UI cleanup'
          git rev-parse HEAD | tee artifacts/verified-commit.txt
          git archive --format=zip HEAD > artifacts/GonkaStats-seo-cleanup-source.zip
          git push origin HEAD:refs/heads/fix/seo-security-cleanup-20261003
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gonkastats-seo-security-cleanup
          path: artifacts/
          retention-days: 3
          if-no-files-found: warn
