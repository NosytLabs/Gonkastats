name: Retire merged audit branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-branch-20260923.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete exact merged branch tip
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/fix%2Fcurrent-audit-20260923 --jq .commit.sha)" = "8e6e2c657ebe6dcea6cc81099ad9bb8900a5eafc"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/7 --jq .merged)" = "true"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/fix/current-audit-20260923
