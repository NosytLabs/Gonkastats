name: Retire merged audit branch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-merged-branch-20260923.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'ops: retire merged Gonkastats audit branch once'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          branch='fix/current-audit-20260923'
          expected='8e6e2c657ebe6dcea6cc81099ad9bb8900a5eafc'
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .commit.sha)" = "$expected"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/7" --jq .merged)" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/7" --jq .head.sha)" = "$expected"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
