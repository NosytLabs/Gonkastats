name: Delete merged branch tips
on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-merged-branch-tips.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only exact merged tips
        shell: bash
        run: |
          set -euo pipefail
          check_and_delete() {
            branch="$1"; expected="$2"; pr="$3"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .commit.sha)"
            test "$actual" = "$expected"
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .merged)" = "true"
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)" = "$expected"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          }
          check_and_delete chore/repo-cleanup 698cac058686bc82260d29b4133da9bcac6c59ed 5
          check_and_delete feat/charts-content-polish 902825074a70eb35c02ad97987a25467e45e450b 3
          check_and_delete fix/audit-unification 530e99bf4f1eacd2199f3866b2d0c5bfbd93b6d1 4
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
