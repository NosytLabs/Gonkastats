name: Retire reviewed integrated branches once
# Owner-requested, exact-tip cleanup. The job disables itself before mutations.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-reviewed-branches-20260921.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: owner-requested-reviewed-branch-cleanup
  cancel-in-progress: false
jobs:
  retire:
    if: >-
      github.repository == 'NosytLabs/Gonkastats' && github.event.head_commit.message == 'ops: retire reviewed integrated branches once'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify integration and delete only unchanged branch tips
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          """One-time deletion of two reviewed ancestor branches; no application execution."""
          import base64
          import json
          import os
          import subprocess
          import tempfile
          from urllib.parse import quote
          
          REPO = 'NosytLabs/Gonkastats'
          EXPECTED = {
              'feat/community-completion': '783fd0171fa0c36b3ecd4dace3b350b83fd9f2bf',
              'feat/ui-revamp': '3876b63630cdb09897c16435647fe3f820ee5748',
          }
          MERGE = 'b0b19ecb9e6ded4feaeda58b4ee25116f7a1b728'
          
          
          def check_candidate(name, expected, current, comparison, open_prs):
              if name not in {'feat/community-completion', 'feat/ui-revamp'}:
                  raise ValueError('Not an approved cleanup branch')
              if current.get('protected') or current.get('commit', {}).get('sha') != expected:
                  raise ValueError('Branch changed or is protected')
              if open_prs:
                  raise ValueError('Branch is referenced by an open pull request')
              if comparison.get('ahead_by') != 0 or comparison.get('merge_base_commit', {}).get('sha') != expected:
                  raise ValueError('Branch tip is not reachable from current main')
          
          
          def api(path, method='GET'):
              result = subprocess.run(['gh', 'api', '--method', method, f'repos/{REPO}/{path}'],
                                      text=True, capture_output=True, timeout=20)
              if result.returncode:
                  raise RuntimeError(f'GitHub API failed: {method} {path}; no retry')
              return json.loads(result.stdout) if result.stdout.strip() else None
          
          
          def all_pages(path, key=None):
              result = []
              for page in range(1, 11):
                  sep = '&' if '?' in path else '?'
                  data = api(f'{path}{sep}per_page=100&page={page}')
                  batch = data if key is None else data[key]
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              raise RuntimeError('Incomplete inventory; cleanup stopped')
          
          
          def verify(name, expected):
              current = api('branches/' + quote(name, safe=''))
              main = api('branches/main')['commit']['sha']
              comparison = api(f'compare/{main}...{expected}')
              prs = all_pages('pulls?state=open&head=' + quote('NosytLabs:' + name, safe=''))
              check_candidate(name, expected, current, comparison, prs)
              return main
          
          
          def delete_with_lease(name, expected):
              ref = 'refs/heads/' + name
              env = {key: value for key, value in os.environ.items() if not key.startswith('GIT_')}
              credential = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
              env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_COUNT='1',
                         GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                         GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + credential)
              with tempfile.TemporaryDirectory() as directory:
                  env['HOME'] = directory
                  init = subprocess.run(['git', 'init', '-q', directory], capture_output=True, env=env, timeout=10)
                  if init.returncode:
                      raise RuntimeError('Temporary Git initialization failed')
                  result = subprocess.run(['git', '-C', directory, 'push', '--porcelain',
                                           '--force-with-lease=' + ref + ':' + expected,
                                           f'https://github.com/{REPO}.git', ':' + ref],
                                          capture_output=True, env=env, timeout=45)
                  if result.returncode:
                      raise RuntimeError(f'Guarded branch deletion failed for {name}; branch may have advanced')
          
          
          def main():
              if os.environ.get('GITHUB_REPOSITORY') != REPO or os.environ.get('GITHUB_REF') != 'refs/heads/main':
                  raise ValueError('Invocation is outside the approved repository/main scope')
              if os.environ.get('GITHUB_EVENT_NAME') != 'push':
                  raise ValueError('Only this explicit one-time push is allowed')
              run_id = int(os.environ['GITHUB_RUN_ID'])
              own = api(f'actions/runs/{run_id}')['workflow_id']
              api(f'actions/workflows/{own}/disable', 'PUT')
              report = {'repository': REPO, 'run_id': run_id, 'deleted_branches': [],
                        'disabled_completed_workflows': [], 'errors': []}
              try:
                  initial = all_pages('branches')
                  preserved = {b['name']: b['commit']['sha'] for b in initial if b['name'] not in EXPECTED}
                  main_before = preserved['main']
                  proof = api(f'compare/{MERGE}...{main_before}')
                  if proof['merge_base_commit']['sha'] != MERGE or proof['status'] not in ('ahead', 'identical'):
                      raise ValueError('Reviewed merge is not reachable from main')
                  for name, sha in EXPECTED.items():
                      verify(name, sha)
                  for status in ('in_progress', 'queued', 'waiting', 'pending', 'requested'):
                      runs = all_pages(f'actions/runs?status={status}', 'workflow_runs')
                      if any(r['head_branch'] in EXPECTED and r['id'] != run_id for r in runs):
                          raise ValueError('A candidate branch still has an active run')
                  for workflow in all_pages('actions/workflows', 'workflows'):
                      if workflow.get('state') == 'active' and workflow.get('path') in {
                          '.github/workflows/verify-ui-revamp.yml',
                          '.github/workflows/verify-community-completion.yml',
                      }:
                          api(f"actions/workflows/{workflow['id']}/disable", 'PUT')
                          report['disabled_completed_workflows'].append(workflow['path'])
                  for name, sha in EXPECTED.items():
                      verify(name, sha)
                      delete_with_lease(name, sha)
                      report['deleted_branches'].append({'name': name, 'sha': sha})
                  after = all_pages('branches')
                  names = {b['name'] for b in after}
                  if names.intersection(EXPECTED) or not set(preserved).issubset(names):
                      raise RuntimeError('Final branch inventory did not pass verification')
                  report.update(main_before=main_before, main_after=api('branches/main')['commit']['sha'],
                                preserved_branches_before=preserved,
                                branches_after=[{'name': b['name'], 'sha': b['commit']['sha']} for b in after])
              except Exception as error:
                  report['errors'].append(f'{type(error).__name__}: {error}')
              report['self_disabled'] = api(f'actions/workflows/{own}')['state'] == 'disabled_manually'
              report['ok'] = not report['errors'] and report['self_disabled'] and len(report['deleted_branches']) == 2
              print('BRANCH_CLEANUP_RESULT=' + json.dumps(report, separators=(',', ':')), flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('# Reviewed branch cleanup\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
              if not report['ok']:
                  raise SystemExit('Cleanup incomplete; see receipt. No automatic retry configured.')
          
          
          if __name__ == '__main__':
              main()
          PYCODE
