name: Verify current main once
# rerun after API registry QA/doc sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-current-once-20260923.yml']
permissions:
  contents: read
concurrency:
  group: verify-current-main-once
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run snapshot
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
