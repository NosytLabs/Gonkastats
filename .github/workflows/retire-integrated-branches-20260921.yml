name: Retire integrated branches once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-integrated-branches-20260921.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  retire:
    if: github.event.head_commit.message == 'ops: retire integrated branches once'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify and delete exact integrated tips
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          own="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$own/disable"
          python3 - <<'PY'
          import base64, json, os, subprocess, tempfile
          from urllib.parse import quote
          repo=os.environ['GITHUB_REPOSITORY']
          expected={
            'chore/repo-cleanup':'698cac058686bc82260d29b4133da9bcac6c59ed',
            'feat/charts-content-polish':'902825074a70eb35c02ad97987a25467e45e450b',
            'fix/audit-unification':'530e99bf4f1eacd2199f3866b2d0c5bfbd93b6d1',
          }
          merged_pr={ 'chore/repo-cleanup':5, 'feat/charts-content-polish':3, 'fix/audit-unification':4 }
          def api(path,method='GET'):
            p=subprocess.run(['gh','api','--method',method,f'repos/{repo}/{path}'],text=True,capture_output=True,timeout=20)
            if p.returncode: raise RuntimeError(f'GitHub API failed: {method} {path}')
            return json.loads(p.stdout) if p.stdout.strip() else None
          main=api('branches/main')['commit']['sha']
          for name,sha in expected.items():
            b=api('branches/'+quote(name,safe=''))
            assert not b['protected'] and b['commit']['sha']==sha
            pr=api(f'pulls/{merged_pr[name]}')
            assert pr['merged'] is True and pr['head']['sha']==sha and pr['head']['ref']==name
            assert not api('pulls?state=open&head='+quote('NosytLabs:'+name,safe=''))
          env={k:v for k,v in os.environ.items() if not k.startswith('GIT_')}
          cred=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env.update(GIT_TERMINAL_PROMPT='0',GIT_CONFIG_NOSYSTEM='1',GIT_CONFIG_COUNT='1',
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+cred)
          with tempfile.TemporaryDirectory() as d:
            env['HOME']=d
            subprocess.run(['git','init','-q',d],check=True,env=env)
            for name,sha in expected.items():
              ref='refs/heads/'+name
              subprocess.run(['git','-C',d,'push','--porcelain','--force-with-lease='+ref+':'+sha,
                f'https://github.com/{repo}.git',':'+ref],check=True,env=env,timeout=45,capture_output=True)
          after=[b['name'] for b in api('branches?per_page=100')]
          assert all(name not in after for name in expected)
          assert 'feat/gonkastats-observatory' in after and 'main' in after
          print(json.dumps({'main':main,'deleted':list(expected),'remaining':after}))
          PY
